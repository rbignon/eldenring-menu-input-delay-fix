name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Sigstore signing of the build provenance, via a short-lived OIDC identity.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Third-party actions are pinned to commit SHAs: this job can mint
      # provenance attestations, and `@stable` and `@v2` are movable refs.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Run tests
        run: cargo test --lib --locked

      - name: Build release DLL
        run: cargo build --lib --release --locked

      # Guards two failure modes at once: resources silently not embedded (the
      # DLL then ships anonymous, which is what build.rs exists to prevent), and
      # a tag that does not match the version in Cargo.toml.
      - name: Verify embedded version info
        shell: pwsh
        run: |
          $info = (Get-Item target/release/MenuInputDelayFix.dll).VersionInfo
          $info | Format-List CompanyName, FileDescription, FileVersion, ProductName, ProductVersion, LegalCopyright
          if (-not $info.CompanyName) { throw "VERSIONINFO is missing from the DLL" }
          $tagged = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($info.FileVersion -ne $tagged) {
            throw "tag $env:GITHUB_REF_NAME does not match the DLL version $($info.FileVersion); bump Cargo.toml"
          }

      # The embedded manifest is the only part of the DLL the loader parses, so
      # prove it still loads. Outside the game the scan finds no eldenring.exe
      # module and the DLL logs that it is running unpatched.
      - name: Smoke test the DLL loads
        shell: pwsh
        run: |
          $dll = (Resolve-Path target/release/MenuInputDelayFix.dll).Path
          $log = Join-Path (Split-Path $dll) MenuInputDelayFix.log
          Remove-Item $log -ErrorAction SilentlyContinue
          [System.Runtime.InteropServices.NativeLibrary]::Load($dll) | Out-Null
          # DllMain hands the work to a thread, so the log lands asynchronously.
          for ($i = 0; $i -lt 50 -and -not (Test-Path $log); $i++) { Start-Sleep -Milliseconds 100 }
          if (-not (Test-Path $log)) { throw "the DLL loaded but never ran DllMain" }
          Get-Content $log

      # The zip and the bare DLL must come from this single build: two builds
      # of the same source produce different binaries (PE timestamp), and two
      # hashes in the wild for one version restart Defender reputation twice.
      # For the same reason, never re-run this workflow for a published tag:
      # it would replace the assets with a new build and new hashes. A run that
      # failed before the publish step below is the exception: it released
      # nothing, so re-running it is safe.
      - name: Package release assets
        shell: bash
        run: |
          cp target/release/MenuInputDelayFix.dll .
          7z a "MenuInputDelayFix-${GITHUB_REF_NAME}.zip" MenuInputDelayFix.dll
          7z l "MenuInputDelayFix-${GITHUB_REF_NAME}.zip"
          sha256sum MenuInputDelayFix.dll "MenuInputDelayFix-${GITHUB_REF_NAME}.zip" | tee SHA256SUMS.txt

      # Binds these exact bytes to this workflow run and commit, so anyone can
      # check a download really came from the public build rather than take the
      # Actions tab on faith. Windows ignores this: it is provenance, not code
      # signing, and it has no effect on antivirus verdicts. Attesting before
      # publishing keeps a failure here from leaving an unattested release
      # behind, which re-running could only fix by rebuilding (new hashes).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            MenuInputDelayFix.dll
            MenuInputDelayFix-${{ github.ref_name }}.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            MenuInputDelayFix.dll
            MenuInputDelayFix-${{ github.ref_name }}.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
